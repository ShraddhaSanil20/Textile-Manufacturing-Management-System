version: '3.8'

services:
  db:
    image: postgres:16
    container_name: textile_postgres
    restart: always
    environment:
      POSTGRES_USER: textile_user
      POSTGRES_PASSWORD: textile_pass
      POSTGRES_DB: textile_db
    ports:
      - "5433:5432"
    volumes:
      - textile_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U textile_user -d textile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  textile_pgdata:
